# GitHub Actions Workflow for sign-sheet
# 自動部署：靜態 HTML → GitHub Pages

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (HTML check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML
        run: |
          echo "=== Validating dashboard.html ==="
          test -f dashboard.html || (echo "❌ dashboard.html missing" && exit 1)
          echo "✅ dashboard.html exists"
          # 簡單 HTML 健全度檢查：必含 <!DOCTYPE html>
          head -1 dashboard.html | grep -qi '<!DOCTYPE html>' || (echo "❌ missing DOCTYPE" && exit 1)
          echo "✅ DOCTYPE present"

  test:
    name: Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify HTML files
        run: |
          echo "=== Check all HTML files exist ==="
          find . -name "*.html" -not -path "./.git/*" -not -path "./node_modules/*" | while read f; do
            echo "  ✓ $f"
            head -1 "$f" | grep -qi '<!DOCTYPE' || (echo "  ❌ $f missing DOCTYPE" && exit 1)
          done
          echo "✅ All HTML files valid"

  build:
    name: Build (static)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          # 複製整個 repo 根目錄到 _site（純靜態，無 build step）
          cp -r . _site/ 2>/dev/null || true
          # 排除 .git 等
          rm -rf _site/.git _site/.github _site/node_modules
          echo "=== Build artifact ==="
          ls -la _site/

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
